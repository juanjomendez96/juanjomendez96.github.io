<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Juan José Méndez Torrero | Data Engineer Portfolio</title>
  <meta name="description"
    content="Portfolio for Juan José Méndez Torrero, a data engineer building resilient pipelines, analytics, and ML products." />
  <script>
    // Resolve the theme before first paint to avoid a flash of the wrong palette.
    (function () {
      var theme = "dark";
      var prefersLight = false;
      try {
        prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      } catch (e) { }
      try {
        var stored = window.localStorage.getItem("preferred-theme");
        theme = stored === "light" || stored === "dark" ? stored : prefersLight ? "light" : "dark";
      } catch (e) {
        theme = prefersLight ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css?v=20261102a" />
</head>

<body>
  <header class="site-header">
    <div class="brand" data-animate="fade-down">
      <a href="#top" class="brand__mark">
        <img src="assets/me.jpeg" alt="Portrait of Juan José Méndez Torrero" loading="lazy" />
      </a>
      <div class="brand__meta">
        <span class="brand__name">Juan José Méndez Torrero</span>
        <span class="brand__role" data-i18n-key="brand.role">Data Engineer · ML Advocate</span>
      </div>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
      <span class="nav-toggle__bar"></span>
      <span class="sr-only" data-i18n-key="nav.toggle">Toggle navigation</span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Primary navigation" data-i18n-attr="aria-label:nav.label">
      <a href="#snapshot" data-i18n-key="nav.snapshot">Snapshot</a>
      <a href="#services" data-i18n-key="nav.services">What I Do</a>
      <a href="#featured" data-i18n-key="nav.featured">Featured Work</a>
      <a href="#toolbox" data-i18n-key="nav.toolbox">Toolbox</a>
      <a href="#education" data-i18n-key="nav.education">Education</a>
      <a href="#contact" data-i18n-key="nav.contact">Let's Connect</a>
      <div class="nav-controls">
        <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Toggle light or dark mode"
          data-i18n-attr="aria-label:theme.toggle">
          <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <div class="locale-switch" role="group" aria-label="Change language"
          data-i18n-attr="aria-label:locale.switcherLabel">
          <button type="button" class="locale-switch__btn" data-locale="en" aria-pressed="false">EN</button>
          <button type="button" class="locale-switch__btn" data-locale="es" aria-pressed="false">ES</button>
        </div>
      </div>
    </nav>
  </header>

  <div class="page">
    <div class="pipeline" aria-hidden="true">
      <span class="pipeline__track"></span>
      <span class="pipeline__fill"></span>
      <span class="pipeline__packet"></span>
    </div>

    <main id="top" class="site-main">
      <div data-partial="hero"></div>
      <div data-partial="snapshot"></div>
      <div data-partial="services"></div>
      <div data-partial="featured"></div>
      <div data-partial="toolbox"></div>
      <div data-partial="education"></div>
      <div data-partial="languages"></div>
    </main>

    <div data-partial="footer"></div>
  </div>

  <script src="assets/js/main.js?v=20261102a" defer></script>
</body>

</html>
